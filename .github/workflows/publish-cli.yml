name: Publish CLI

on:
  push:
    tags:
      - "cli-v*"

jobs:
  publish:
    uses: ./.github/workflows/publish-package.yml
    with:
      package-dir: cli
      package-name: "@bc-forge/cli"
      build-command: npm run build --workspace @bc-forge/cli
      test-command: npm test --workspace @bc-forge/cli
      tag-prefix: "cli-v"
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}