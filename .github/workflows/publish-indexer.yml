name: Publish Indexer

on:
  push:
    tags:
      - "indexer-v*"

jobs:
  publish:
    uses: ./.github/workflows/publish-package.yml
    with:
      package-dir: indexer
      package-name: "@bc-forge/indexer"
      build-command: npm run build --workspace @bc-forge/indexer
      test-command: npm test --workspace @bc-forge/indexer
      tag-prefix: "indexer-v"
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}